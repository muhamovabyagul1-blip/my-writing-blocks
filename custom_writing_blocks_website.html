<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Writing Blocks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 0;
    }

    header {
      background: #4a6cf7;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      resize: vertical;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #4a6cf7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #3a55d1;
    }

    .blocks {
      margin-top: 30px;
    }

    .block {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: relative;
    }

    .delete {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #ff4d4d;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      padding: 5px 10px;
    }

    .delete:hover {
      background: #cc0000;
    }
  </style>
</head>
<body>

<header>
  My Writing Blocks
</header>

<div class="container">
  <textarea id="input" placeholder="Write your text block here..."></textarea>
  <button onclick="addBlock()">Add Block</button>

  <div class="blocks" id="blocks"></div>
</div>

<script>
  const blocksContainer = document.getElementById('blocks');

  function addBlock() {
    const input = document.getElementById('input');
    const text = input.value.trim();

    if (text === '') return;

    const block = document.createElement('div');
    block.className = 'block';

    const content = document.createElement('p');
    content.textContent = text;

    const delBtn = document.createElement('button');
    delBtn.textContent = 'Delete';
    delBtn.className = 'delete';
    delBtn.onclick = () => block.remove();

    block.appendChild(delBtn);
    block.appendChild(content);

    blocksContainer.prepend(block);
    input.value = '';
  }
</script>

</body>
</html>
