<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Writing Blocks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
    }

    header {
      background: #4a6cf7;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      background: #4a6cf7;
      color: white;
      border: none;
      cursor: pointer;
    }

    .block {
      background: white;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<header>My Writing Blocks</header>

<div class="container">
  <textarea id="input" placeholder="Write something..."></textarea>
  <button onclick="addBlock()">Add Block</button>

  <div id="blocks"></div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } 
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgAyvABFCIAjX0wop4PhySWvIXMs1fKE",
    authDomain: "writing-blocks.firebaseapp.com",
    projectId: "writing-blocks",
    storageBucket: "writing-blocks.firebasestorage.app",
    messagingSenderId: "688148088171",
    appId: "1:688148088171:web:fa0efac2c4fa21d1d4382e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const container = document.getElementById("blocks");

  window.addBlock = async function () {
    const input = document.getElementById("input");
    if (!input.value.trim()) return;

    await addDoc(collection(db, "blocks"), {
      content: input.value,
      created: new Date()
    });

    input.value = "";
  };

  const q = query(collection(db, "blocks"), orderBy("created", "desc"));

  onSnapshot(q, (snapshot) => {
    container.innerHTML = "";
    snapshot.forEach(doc => {
      const div = document.createElement("div");
      div.className = "block";
      div.textContent = doc.data().content;
      container.appendChild(div);
    });
  });
</script>

</body>
</html>
</html>
